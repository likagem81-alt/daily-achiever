<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fbf9"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">WEATHERING — UPSC QUICK DIAGRAM</text><rect x="70" y="105" width="330" height="180" rx="18" fill="#e7f2ea" stroke="#38734d" stroke-width="3"/><text x="235" y="145" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">PHYSICAL</text><text x="95" y="190" font-family="Arial" font-size="22">• Thermal expansion</text><text x="95" y="230" font-family="Arial" font-size="22">• Frost action</text><text x="95" y="270" font-family="Arial" font-size="22">• Salt crystallisation</text><rect x="435" y="105" width="330" height="180" rx="18" fill="#eef3f8" stroke="#416b8f" stroke-width="3"/><text x="600" y="145" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">CHEMICAL</text><text x="460" y="190" font-family="Arial" font-size="22">• Carbonation</text><text x="460" y="230" font-family="Arial" font-size="22">• Oxidation / hydration</text><text x="460" y="270" font-family="Arial" font-size="22">• Hydrolysis / solution</text><rect x="800" y="105" width="330" height="180" rx="18" fill="#f5efe5" stroke="#927447" stroke-width="3"/><text x="965" y="145" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">BIOLOGICAL</text><text x="825" y="190" font-family="Arial" font-size="22">• Roots and plants</text><text x="825" y="230" font-family="Arial" font-size="22">• Animals</text><text x="825" y="270" font-family="Arial" font-size="22">• Microorganisms</text><path d="M600 330v65" stroke="#333" stroke-width="5"/><path d="M580 380l20 25 20-25" fill="none" stroke="#333" stroke-width="5"/><rect x="180" y="430" width="840" height="145" rx="20" fill="#fff" stroke="#444" stroke-width="3"/><text x="600" y="470" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">WEATHERING ≠ EROSION</text><text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="22">Weathering = breakdown IN SITU</text><text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="22">Erosion = removal + transportation</text></svg>